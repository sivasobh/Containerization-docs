## Example values for Bitnami Redis Helm chart (adjust to chart version)
global:
  redis:
    password: "REPLACE_WITH_STRONG_PASSWORD"

architecture: "cluster"
cluster:
  enabled: true
  slaveCount: 3

persistence:
  enabled: true
  storageClass: "standard"
  size: 10Gi

resources:
  master:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  replica:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

affinity: |
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - redis
        topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

service:
  type: ClusterIP

metrics:
  enabled: true

# TLS: If using Redis 6+ with TLS, configure certs and args per chart docs.
