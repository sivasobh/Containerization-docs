apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: linkerd-demo
  labels:
    app: backend
    version: v1
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend
    version: v1

---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: linkerd-demo
  labels:
    app: backend
    version: v2
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend
    version: v2

---
apiVersion: split.smi-spec.io/v1alpha4
kind: TrafficSplit
metadata:
  name: backend-split
  namespace: linkerd-demo
spec:
  service: backend
  backends:
    - service: backend-v1
      weight: 90
    - service: backend-v2
      weight: 10
