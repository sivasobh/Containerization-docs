apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mesh-demo
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: mesh-demo
  labels:
    app: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=backend-v1"
            - "-listen=:8080"
          ports:
            - containerPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: mesh-demo
  labels:
    app: backend
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      version: v2
  template:
    metadata:
      labels:
        app: backend
        version: v2
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:0.2.3
          args:
            - "-text=backend-v2"
            - "-listen=:8080"
          ports:
            - containerPort: 8080

---
# Simple client pod for testing (keeps shell access)
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: mesh-demo
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.1.2
      command: ["/bin/sh","-c","sleep 1d"]
  restartPolicy: Never
