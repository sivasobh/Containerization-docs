<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style> .title { font: bold 18px sans-serif } .label{ font: 12px sans-serif } .box{ fill:#f3f7fb; stroke:#2b6cb0; stroke-width:1.5 } .proxy{ fill:#fff7ed; stroke:#d69e2e } </style>
  <text x="20" y="28" class="title">Service Mesh Architecture (control plane + data plane)</text>

  <!-- Control plane -->
  <rect x="20" y="50" width="240" height="120" class="box" rx="6"/>
  <text x="40" y="80" class="label">Control Plane</text>
  <text x="40" y="100" class="label">- Config (routing, policies)</text>
  <text x="40" y="120" class="label">- CA / mTLS certs</text>
  <text x="40" y="140" class="label">- Telemetry Gateway</text>

  <!-- Gateway -->
  <rect x="300" y="40" width="160" height="60" class="box" rx="6"/>
  <text x="320" y="65" class="label">Ingress / Egress Gateway</text>

  <!-- Services with sidecars -->
  <rect x="20" y="200" width="260" height="180" class="box" rx="6"/>
  <text x="40" y="230" class="label">Kubernetes Cluster (data plane)</text>

  <!-- Pod 1 -->
  <rect x="320" y="150" width="220" height="80" class="proxy" rx="6"/>
  <text x="350" y="175" class="label">Service A Pod</text>
  <text x="350" y="195" class="label">- App container</text>
  <text x="350" y="215" class="label">- Sidecar proxy (Envoy)</text>

  <!-- Pod 2 -->
  <rect x="560" y="150" width="220" height="80" class="proxy" rx="6"/>
  <text x="590" y="175" class="label">Service B Pod</text>
  <text x="590" y="195" class="label">- App container</text>
  <text x="590" y="215" class="label">- Sidecar proxy (Envoy)</text>

  <!-- arrows -->
  <line x1="260" y1="110" x2="300" y2="70" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420" y1="190" x2="420" y2="150" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="540" y1="190" x2="560" y2="190" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0" />
    </marker>
  </defs>

  <text x="300" y="110" class="label">Control plane config + certs pushed to proxies</text>
  <text x="300" y="130" class="label">Proxy enforces mTLS, routing, telemetry</text>
</svg>
